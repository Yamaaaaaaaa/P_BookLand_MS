version: '3.8'

services:
  # ================================================
  # INFRASTRUCTURE SERVICES
  # ================================================

  # MySQL — Identity Service DB
  identity-db:
    image: mysql:8.0
    container_name: identity-db
    environment:
      MYSQL_DATABASE: identity_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - identity_data:/var/lib/mysql

  # MySQL — User Service DB
  user-db:
    image: mysql:8.0
    container_name: user-db
    environment:
      MYSQL_DATABASE: user_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3308:3306"
    volumes:
      - user_data:/var/lib/mysql

  # MySQL — Book Service DB
  book-db:
    image: mysql:8.0
    container_name: book-db
    environment:
      MYSQL_DATABASE: book_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - book_data:/var/lib/mysql

  # MySQL — Order Service DB
  order-db:
    image: mysql:8.0
    container_name: order-db
    environment:
      MYSQL_DATABASE: order_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3310:3306"
    volumes:
      - order_data:/var/lib/mysql

  # MySQL — Event Service DB
  event-db:
    image: mysql:8.0
    container_name: event-db
    environment:
      MYSQL_DATABASE: event_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3311:3306"
    volumes:
      - event_data:/var/lib/mysql

  # MongoDB — Notification Service DB
  notification-db:
    image: mongo:7.0
    container_name: notification-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: notification_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # Redis — Shared cache
  redis:
    image: redis:7-alpine
    container_name: bookland-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass bookland123

  # Zookeeper (Kafka dependency)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bookland-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Kafka UI (Debug)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: bookland-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # MinIO (File Storage — self-hosted S3)
  minio:
    image: minio/minio:latest
    container_name: bookland-minio
    ports:
      - "9000:9000"
      - "9001:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: bookland
      MINIO_ROOT_PASSWORD: bookland123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ================================================
  # BUSINESS SERVICES
  # ================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=bookland-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=bookland123
      - IDENTITY_SERVICE_HOST=identity-service
      - USER_SERVICE_HOST=user-service
      - BOOK_SERVICE_HOST=book-service
      - ORDER_SERVICE_HOST=order-service
      - EVENT_SERVICE_HOST=event-service
      - NOTIFICATION_SERVICE_HOST=notification-service
      - FILE_SERVICE_HOST=file-service
      - SEARCH_SERVICE_HOST=search-service
    depends_on:
      - redis

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: identity-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://identity-db:3306/identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - REDIS_HOST=bookland-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=bookland123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookland-kafka:29092
    depends_on:
      - identity-db
      - redis
      - kafka

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://user-db:3306/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookland-kafka:29092
      - BOOK_SERVICE_HOST=book-service
    depends_on:
      - user-db
      - kafka

  book-service:
    build:
      context: .
      dockerfile: services/book-service/Dockerfile
    container_name: book-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://book-db:3306/book_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookland-kafka:29092
    depends_on:
      - book-db
      - kafka

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://order-db:3306/order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookland-kafka:29092
      - BOOK_SERVICE_HOST=book-service
      - USER_SERVICE_HOST=user-service
      - EVENT_SERVICE_HOST=event-service
    depends_on:
      - order-db
      - kafka

  event-service:
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    container_name: event-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://event-db:3306/event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - ORDER_SERVICE_HOST=order-service
    depends_on:
      - event-db

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_MONGODB_URI=mongodb://root:root@notification-db:27017/notification_db?authSource=admin
      - REDIS_HOST=bookland-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=bookland123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookland-kafka:29092
    depends_on:
      - notification-db
      - redis
      - kafka

  file-service:
    build:
      context: .
      dockerfile: services/file-service/Dockerfile
    container_name: file-service
    ports:
      - "8087:8087"
    environment:
      - MINIO_ENDPOINT=http://bookland-minio:9000
      - MINIO_ACCESS_KEY=bookland
      - MINIO_SECRET_KEY=bookland123
      - MINIO_BUCKET_NAME=bookland
    depends_on:
      - minio

  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: search-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_ELASTICSEARCH_URIS=http://bookland-elasticsearch:9200
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=bookland-kafka:29092
    depends_on:
      - elasticsearch
      - kafka

volumes:
  identity_data:
  user_data:
  book_data:
  order_data:
  event_data:
  mongo_data:
  minio_data:
  es_data:
