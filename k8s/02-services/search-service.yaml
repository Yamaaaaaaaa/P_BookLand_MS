apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: bookland
spec:
  ports:
    - port: 8088
      targetPort: 8088
  selector:
    app: search-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: bookland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: bookland/search-service:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_ELASTICSEARCH_URIS
              value: "http://elasticsearch:9200"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          ports:
            - containerPort: 8088
