apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: bookland
spec:
  ports:
    - port: 8084
      targetPort: 8084
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: bookland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: bookland/order-service:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/bookland_order?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "root"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SERVICES_BOOK_SERVICE_URL
              value: "http://book-service:8083"
            - name: SERVICES_USER_SERVICE_URL
              value: "http://user-service:8082"
            - name: SERVICES_EVENT_SERVICE_URL
              value: "http://event-service:8085"
          ports:
            - containerPort: 8084
