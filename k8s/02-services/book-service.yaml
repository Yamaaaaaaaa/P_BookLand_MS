apiVersion: v1
kind: Service
metadata:
  name: book-service
  namespace: bookland
spec:
  ports:
    - port: 8083
      targetPort: 8083
  selector:
    app: book-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
  namespace: bookland
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
        - name: book-service
          image: bookland/book-service:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/bookland_book?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "root"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: USER_SERVICE_HOST
              value: "user-service"
            - name: SEARCH_SERVICE_HOST
              value: "search-service"
            - name: ORDER_SERVICE_HOST
              value: "order-service"
          ports:
            - containerPort: 8083
