server:
  port: 8085
  forward-headers-strategy: framework

spring:
  application:
    name: event-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3311/event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

services:
  order-service:
    url: http://${ORDER_SERVICE_HOST:localhost}:8084
  book-service:
    url: http://${BOOK_SERVICE_HOST:localhost}:8083
  user-service:
    url: http://${USER_SERVICE_HOST:localhost}:8082

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_KEY}
  bucket: ${SUPABASE_BUCKET}
