server:
  port: 8085

spring:
  application:
    name: event-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3311/event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

services:
  order-service:
    url: http://${ORDER_SERVICE_HOST:localhost}:8084
  book-service:
    url: http://${BOOK_SERVICE_HOST:localhost}:8083
  user-service:
    url: http://${USER_SERVICE_HOST:localhost}:8082

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_KEY}
  bucket: ${SUPABASE_BUCKET}
management:
  tracing:
    sampling:
      probability: 1.0
    enabled: true
  propagation:
    type: w3c

logging:
  level:
    root: WARN
    com.bookland: INFO
    org.springframework: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.apache.kafka: WARN
    org.apache.zookeeper: WARN
