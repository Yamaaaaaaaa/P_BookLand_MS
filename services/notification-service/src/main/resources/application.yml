server:
  port: 8086

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${SPRING_MONGODB_URI:mongodb://root:root@localhost:27017/notification_db?authSource=admin}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:bookland123}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: notification-group
      properties:
        spring.json.trusted.packages: "com.bookland.*"
        spring.json.type.mapping: "com.bookland.order.dto.event.NotificationEvent:com.bookland.notification.dto.event.NotificationEvent,com.bookland.chat.dto.event.ChatEvent:com.bookland.notification.dto.event.ChatEvent"

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${MAIL_USERNAME:pbookland2k4@gmail.com}
    password: ${MAIL_PASSWORD:fvwl sizc wvwk vlgy}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

