server:
  port: 8082

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3308/user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  kafka:
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: user-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.bookland.*"
  # Tắt login page mặc định của Spring Security (xác thực do Gateway xử lý)
  security:
    user:
      name: disabled
      password: disabled

services:
  book-service:
    url: http://${BOOK_SERVICE_HOST:localhost}:8083
management:
  tracing:
    sampling:
      probability: 1.0
    enabled: true
  propagation:
    type: w3c

logging:
  level:
    root: WARN
    com.bookland: INFO
    org.springframework: WARN
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.apache.kafka: WARN
    org.apache.zookeeper: WARN
