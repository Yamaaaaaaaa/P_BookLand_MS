server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:bookland123}
  cloud:
    gateway:
      routes:
        # Identity Service
        - id: identity-service
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/auth/**, /api/roles/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20

        # User Service
        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/users/**, /api/addresses/**, /api/wishlists/**

        # Book Service
        - id: book-service
          uri: http://${BOOK_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/books/**, /api/authors/**, /api/categories/**, /api/series/**, /api/publishers/**

        # Order Service
        - id: order-service
          uri: http://${ORDER_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/bills/**, /api/carts/**, /vnpay/**, /api/payment-methods/**, /api/shipping-methods/**

        # Event Service
        - id: event-service
          uri: http://${EVENT_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/events/**

        # Notification Service
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/api/notifications/**, /ws/**

        # File Service
        - id: file-service
          uri: http://${FILE_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/api/files/**

        # Search Service
        - id: search-service
          uri: http://${SEARCH_SERVICE_HOST:localhost}:8088
          predicates:
            - Path=/api/search/**

resilience4j:
  circuitbreaker:
    instances:
      book-service:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
