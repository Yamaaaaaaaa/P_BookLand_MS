server:
  port: 8087
  forward-headers-strategy: framework

spring:
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:bookland}
  secret-key: ${MINIO_SECRET_KEY:bookland123}
  bucket: ${MINIO_BUCKET_NAME:bookland}

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_KEY}
  bucket: ${SUPABASE_BUCKET}
