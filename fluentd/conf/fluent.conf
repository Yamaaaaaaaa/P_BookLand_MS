<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Thu thập toàn bộ log từ các container docker chuyển tới
<match docker.**>
  @type copy
  
  # Ghi vào Elasticsearch
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix bookland
    logstash_dateformat %Y.%m.%d
    include_tag_key true
    tag_key @log_name
    
    # Sử dụng giao thức http và bỏ qua ssl (phù hợp với môi trường local không bật bảo mật cho ES)
    scheme http
    ssl_verify false
    
    <buffer>
      @type file
      path /fluentd/log/elastic-buffer
      flush_mode interval
      retry_type exponential_backoff
      flush_thread_count 2
      flush_interval 2s
      retry_forever true
      chunk_limit_size 2M
      queue_limit_length 8
    </buffer>
  </store>
  
  # In ra Console phục vụ việc kiểm tra qua `docker compose logs fluentd`
  <store>
    @type stdout
  </store>
</match>
